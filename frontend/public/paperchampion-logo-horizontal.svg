  <path d="M18 28l6 8 8-11 8 11 6-8v15H18z" fill="url(#crown)" />
  <path d="M22 44h24" fill="none" stroke="#92400E" stroke-width="3" stroke-linecap="round" />
  <path d="M29 35h10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <text x="72" y="42" class="wordmark">PaperChampion</text>
