<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 64" width="380" height="64" role="img" aria-labelledby="title desc">
  <title id="title">PaperChampion logo</title>
  <desc id="desc">PaperChampion wordmark with a paper and crown icon.</desc>
  <defs>
    <linearGradient id="bg" x1="10" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F766E" />
      <stop offset="1" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="crown" x1="20" y1="22" x2="44" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE68A" />
      <stop offset="1" stop-color="#F59E0B" />
    </linearGradient>
    <style>
      .wordmark {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 28px;
        font-weight: 700;
        fill: #111827;
        letter-spacing: 0;
      }
    </style>
