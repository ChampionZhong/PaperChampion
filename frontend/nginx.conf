# PaperChampion frontend Nginx configuration.

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # MIME types include .mjs for the PDF.js worker.
    default_type text/html;
    types {
        text/html                   html htm;
        application/javascript      js mjs;
        text/css                    css;
        application/json            json;
        image/png                   png;
        image/jpeg                  jpg jpeg;
        image/gif                   gif;
        image/svg+xml               svg svgz;
        image/x-icon                ico;
        font/woff                   woff;
        font/woff2                  woff2;
        application/font-sfnt       ttf;
    }

    # Gzip level 6 balances compression ratio and CPU usage.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        font/woff
        font/woff2
        image/svg+xml;

    # Never cache index.html so chunk hash mappings stay fresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Vite assets are content-hashed and can be cached long-term.
    location ~* \.(js|mjs|css|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA route fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy.
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Health check.
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
}
