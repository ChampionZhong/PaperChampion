services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: paperchampion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperchampion
      POSTGRES_USER: paperchampion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - paperchampion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperchampion -d paperchampion"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  paperchampion_pgdata:
